<section class="row justify-content-center app-form-container">
  <div class="col-12 col-md-8 col-lg-6 col-xl-5">
    <header class="app-form-header">
      <h2 class="app-form-title">
        Exclusão de Grupo de Veículos
        <mat-icon class="app-form-title__icon">category</mat-icon>
      </h2>
      <hr class="app-form-divider" />
    </header>

    <mat-card class="app-form-card mb-2">
      @if (vehicleGroup$ | async; as vehicleGroup) {
        <form (ngSubmit)="confirmDelete()">
          <mat-card-header>
            <mat-card-title class="mb-3">Confirme a exclusão do registro</mat-card-title>
          </mat-card-header>

          <mat-card-content>
            <p class="fs-6">
              Você deseja realmente excluir o grupo "<strong>{{ vehicleGroup.name }}</strong
              >"? Esta ação é irreversível.
            </p>
          </mat-card-content>

          <mat-card-actions>
            <button
              type="button"
              mat-stroked-button
              class="app-secondary-button"
              (click)="goBack()"
            >
              Voltar
            </button>

            <button mat-flat-button type="submit" class="app-primary-button">
              <mat-icon>check</mat-icon>
              Confirmar
            </button>
          </mat-card-actions>
        </form>
      }
    </mat-card>
  </div>
</section>
