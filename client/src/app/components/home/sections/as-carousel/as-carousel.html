<div
  id="heroCarousel"
  class="carousel slide hero-carousel"
  data-bs-ride="carousel"
  data-bs-interval="6000"
>
  <div class="carousel-indicators">
    <button
      type="button"
      data-bs-target="#heroCarousel"
      data-bs-slide-to="0"
      class="active"
      aria-current="true"
      aria-label="Slide 1"
    ></button>
    <button
      type="button"
      data-bs-target="#heroCarousel"
      data-bs-slide-to="1"
      aria-label="Slide 2"
    ></button>
    <button
      type="button"
      data-bs-target="#heroCarousel"
      data-bs-slide-to="2"
      aria-label="Slide 3"
    ></button>
  </div>

  <div class="carousel-inner">
    <!-- SLIDE 1 -->
    <div class="carousel-item active">
      <div class="hero-slide hero-slide-image-only">
        <div class="hero-slide-center hero-slide-center-full">
          <img
            src="home/oblivion-banner.png"
            class="hero-car-img"
            alt="Carro em destaque para locação"
          />
        </div>
      </div>
    </div>

    <!-- SLIDE 2 -->
    <div class="carousel-item">
      <div class="hero-slide hero-slide-image-only">
        <div class="hero-slide-center hero-slide-center-full">
          <img
            src="home/procurando-carro.png"
            class="hero-car-img"
            alt="Carro disponível para locação"
          />
        </div>
      </div>
    </div>

    <!-- SLIDE 3 -->
    <div class="carousel-item">
      <div class="hero-slide hero-slide-image-only">
        <div class="hero-slide-center hero-slide-center-full">
          <img
            src="home/controle-total.png"
            class="hero-car-img"
            alt="Painel de gestão de locações"
          />
        </div>
      </div>
    </div>
  </div>
</div>
